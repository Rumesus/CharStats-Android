plugins {
    id 'com.android.application'
}

android {
    namespace 'com.charstats.mobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.charstats.mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            pickFirsts += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/NOTICE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'

    implementation "cz.adaptech.tesseract4android:tesseract4android:4.9.0"
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'commons-codec:commons-codec:1.17.1'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    implementation files('../poishadow/build/libs/poishadow-all.jar')
}

preBuild.dependsOn ':poishadow:shadowJar'

// Автоматично завантажуємо ukr/rus/eng + osd traineddata під час складання APK.
def tessDir = file("src/main/assets/tessdata")
tasks.register("downloadTessdata") {
    doLast {
        tessDir.mkdirs()
        ['ukr','rus','eng','osd'].each { lang ->
            def out = new File(tessDir, "${lang}.traineddata")
            if (!out.exists()) {
                new URL("https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/${lang}.traineddata")
                    .withInputStream { i -> out.withOutputStream { it << i } }
            }
        }
    }
}
preBuild.dependsOn tasks.named("downloadTessdata")
